<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Controle financeiro pessoal e da empresa, com DRE, vencimentos, cartões e relatórios em PDF.">
<title>Gestão Financeira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#F7F8FA; --ink:#101828; --muted:#5B6576; --line:#E1E5EB;
  --brand:#0B2545; --brand-ink:#FFFFFF; --accent:#1D4E89; --gasto:#B42318; --ganho:#067647; --sun:#B54708; --chip:#ECEFF3; --bar:#1D4E89;
  --head:#0B2545; --head-ink:#FFFFFF; --head-mut:#A9B8CC;
  --display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-ctx="pj"]{--head:#1E2A3A;--accent:#3E4C8A;--bar:#3E4C8A}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A101C; --surface:#111A2A; --surface2:#162033; --ink:#E6EAF0; --muted:#98A2B3; --line:#233049;
    --brand:#9DBCE6; --brand-ink:#0A101C; --accent:#9DBCE6; --gasto:#F97066; --ganho:#47CD89; --sun:#FDB022; --chip:#1A2539; --bar:#7FA6DA;
    --head:#0E1626; --head-ink:#E6EAF0; --head-mut:#8A98AE;
  }
}
:root[data-theme="dark"]{
  --bg:#0A101C; --surface:#111A2A; --surface2:#162033; --ink:#E6EAF0; --muted:#98A2B3; --line:#233049;
  --brand:#9DBCE6; --brand-ink:#0A101C; --accent:#9DBCE6; --gasto:#F97066; --ganho:#47CD89; --sun:#FDB022; --chip:#1A2539; --bar:#7FA6DA;
  --head:#0E1626; --head-ink:#E6EAF0; --head-mut:#8A98AE;
}
html{scroll-padding-top:calc(110px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:640px;margin:0 auto;padding:4px 16px 160px}
header.top{position:sticky;top:0;z-index:7;background:var(--head);color:var(--head-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;margin-top:calc(-1 * env(safe-area-inset-top,0px))}
header.top .hin{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top .ctxbar{max-width:640px;margin:8px auto 0}
.brandname{font-family:var(--display);font-weight:700;font-size:16.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brandname .lg{width:24px;height:24px;border-radius:6px;background:var(--head-ink);color:var(--head);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:-.02em}
header.top .pill{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--head-ink)}
header.top .pill b{color:var(--head-ink)}
.ctxseg{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;gap:3px}
.ctxseg button{flex:1;min-width:0;border:0;background:transparent;color:var(--head-mut);padding:7px 8px;border-radius:6px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxseg button[aria-pressed="true"]{background:var(--head-ink);color:var(--head)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill b{color:var(--ink);font-weight:600}
h1.tt{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.015em;margin:14px 0 2px}
.ctxlbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.ctxlbl+h1.tt{margin-top:2px}
h2{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.note{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:13.5px;color:var(--muted);margin:10px 0}
.note b{color:var(--ink)}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:6px;font-weight:600;color:var(--muted);font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.seg.tipo button[data-t="despesa"][aria-pressed="true"]{color:var(--gasto)}
.seg.tipo button[data-t="receita"][aria-pressed="true"]{color:var(--ganho)}
.valor{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-family:var(--display);font-weight:700;font-size:clamp(36px,10vw,52px);letter-spacing:-.025em;padding:14px 0 6px;color:var(--gasto);outline:none}
.valor:focus{border-bottom-color:var(--accent)}
.valor.receita{color:var(--ganho)}
.valor::placeholder{color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-size:14px;line-height:1.25;display:inline-flex;align-items:center;gap:6px;flex-direction:row}
.chip small{display:block;font-size:11.5px;color:var(--muted)}
.chip:has(small){flex-direction:column;align-items:flex-start;gap:0}
a.chip{color:var(--ink);text-decoration:none}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.chip[aria-pressed="true"] small{color:var(--brand-ink);opacity:.85}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13.5px;display:flex;align-items:center;gap:9px;text-align:left;line-height:1.2;min-height:46px}
.cat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:600}
.cb{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.02em;color:#fff;line-height:1}
.cb.em{background:var(--surface2)!important;font-size:16px;color:inherit}
.cb.lg{width:40px;height:40px;font-size:14px;border-radius:8px}
.cb.lg.em{font-size:22px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
select.field{appearance:auto}
label.lb{display:block}
label.lb>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.dias{display:flex;gap:6px;align-items:center}
.dias input{flex:1;min-width:0}
.resumo{margin-top:10px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px}
.resumo b{font-size:15px}
.foto{display:flex;gap:8px}
.foto label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed color-mix(in srgb,var(--muted) 55%,transparent);border-radius:8px;padding:12px;background:var(--surface);font-weight:600;font-size:14.5px;cursor:pointer}
.foto input{position:absolute;width:1px;height:1px;opacity:0}
.savebar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));padding:10px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.savebar .in{max-width:640px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--brand);border-radius:8px;padding:13px;font-weight:600;font-size:15.5px;background:var(--brand);color:var(--brand-ink);text-align:center;text-decoration:none}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--gasto);border:1px solid color-mix(in srgb,var(--gasto) 55%,transparent)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:7px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
a.wa{background:#157347;border-color:#157347;color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{position:relative;border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs button .i{font-size:21px;line-height:1}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--gasto);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:700}
nav.side{display:none}
.mes{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
.mes button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;font-size:18px;color:var(--muted)}
.mes .l{font-family:var(--display);font-weight:600;font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpis.k4{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kpi b{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pos{color:var(--ganho)} .neg{color:var(--gasto)} .mut{color:var(--muted)}
.dia{font-size:12px;color:var(--muted);margin:18px 2px 6px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted);font-size:12.5px}
.item .v{font-weight:600;white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.02em;border-radius:4px;padding:1px 6px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.red{background:color-mix(in srgb,var(--gasto) 14%,transparent);color:var(--gasto)}.tag.amb{background:color-mix(in srgb,var(--sun) 16%,transparent);color:var(--sun)}
.tag.pj{background:color-mix(in srgb,#3E4C8A 16%,transparent);color:#5161A8}
.empty{text-align:center;color:var(--muted);padding:30px 12px}
.big{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:-.025em;line-height:1.1;margin:4px 0 2px}
.bar{height:7px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--bar)}
.bar.warn i{background:var(--sun)} .bar.over i{background:var(--gasto)} .bar.ok i{background:var(--ganho)}
.hb{padding:7px 0}
.hb .row{font-size:14px}
.lst .li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.lst .li:last-child{border-bottom:0}
.x{border:0;background:none;color:var(--muted);font-size:16px;padding:4px 8px}
.orcin{width:130px;text-align:right}
.ag{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.ag .dt{flex:none;width:46px;text-align:center;border-radius:8px;background:var(--surface2);border:1px solid var(--line);padding:5px 0;line-height:1.1}
.ag .dt b{display:block;font-family:var(--display);font-size:18px}
.ag .dt small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ag .t{flex:1;min-width:0}
.ag .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ag .acts button,.ag .acts a{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:13px;text-decoration:none;color:var(--ink)}
.menu a,.menu button.mi,.menu label.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:6px;font-size:15px;font-weight:500}
.menu .mi>span:first-child{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);font-size:18px;flex:none}
.menu .mi small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.sheet{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:640px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet h3{font-family:var(--display);margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14.5px;margin:12px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:60;font-size:14.5px;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
label.ck{display:flex;gap:10px;align-items:center;padding:6px 0}
label.ck input{width:19px;height:19px;accent-color:var(--accent);flex:none}
.chart svg{display:block;width:100%;height:auto;max-width:720px;margin:0 auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--chip);margin:8px 0}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lock h3{font-family:var(--display);font-size:21px;margin:0 0 6px;font-weight:700}
.dots{display:flex;gap:12px;margin:18px 0 22px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-family:var(--display);font-weight:600}
.lgrid{display:block}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.th{position:relative;display:block;border:0;padding:0;background:none}
.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:var(--surface2)}
.th button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;width:28px;height:28px}
.it{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.it .full{grid-column:1/-1}
.tb .tr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tb .tr small{display:block;font-size:12px}
.tb .tr:last-child{border-bottom:0;font-weight:700}
.dre .tr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.dre .tr span:first-child{color:var(--muted)}
.dre .tr span:last-child{white-space:nowrap;text-align:right}
.dre .tr.sub{padding-left:12px;font-size:13.5px}
.dre .tr.tot{font-weight:700;border-bottom:1px solid var(--ink)}
.dre .tr.tot span:first-child{color:var(--ink)}
.dre .tr.fim{font-weight:700;font-size:15px;border-bottom:0;padding-top:10px}
.dre .tr.fim span:first-child{color:var(--ink)}
.dre .tr small{color:var(--muted);font-weight:400;margin-left:6px}
.dre .tr.out{opacity:.8;font-style:italic;border-bottom:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.sheet .box{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (min-width:900px){
  nav.tabs{display:none}
  nav.side{display:flex;flex-direction:column;gap:2px;position:fixed;top:0;bottom:0;left:0;width:240px;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 18px;background:var(--surface);border-right:1px solid var(--line);z-index:8;overflow:auto}
  nav.side .brandname{padding:2px 10px 18px}
  nav.side .brandname .lg{background:var(--brand);color:var(--brand-ink)}
  nav.side .sg{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
  nav.side button{position:relative;display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:7px;padding:9px 12px;text-align:left;color:var(--muted);font-size:14.5px;font-weight:500}
  nav.side button .i{width:20px;text-align:center;font-size:17px;display:grid;place-items:center}
  nav.side button[aria-current="page"]{background:var(--chip);color:var(--ink);font-weight:600}
  nav.side .badge{position:static;margin-left:auto}
  body{padding-left:240px}
  header.top .hin,header.top .ctxbar{max-width:1180px}
  header.top{display:flex;gap:18px;align-items:center;justify-content:space-between}
  header.top .hin{flex:1;margin:0;order:2;justify-content:flex-end}
  header.top .hin .brandname{display:none}
  header.top .ctxbar{margin:0;order:1;width:min(520px,60%)}
  .wrap{max-width:1180px;padding-bottom:110px}
  .savebar{left:240px;bottom:0}
  .savebar .in{max-width:520px}
  .lgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:start}
  .dash{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .dash .full{grid-column:1/-1}
  .kpis.k4{grid-template-columns:repeat(4,1fr)}
  .cols2{columns:2;column-gap:18px}
  .cols2>*{break-inside:avoid}
  .sheet{align-items:center}
  .sheet .box{border-radius:14px;max-width:580px}
}
@media (min-width:1700px){ body{zoom:1.25} }
</style>
</head>
<body>

const ymd=d=>ym(d)+"-"+pad(d.getDate());
const HOJE=()=>ymd(new Date()), CUR=()=>ym(new Date());
function addMonth(m,k){let[y,mo]=m.split("-").map(Number);mo+=k;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+"-"+pad(mo)}
function mDiff(a,b){const[ay,am]=a.split("-").map(Number),[by,bm]=b.split("-").map(Number);return(by-ay)*12+(bm-am)}
function dAdd(iso,k){const[y,m,d]=iso.split("-").map(Number);let mm=m-1+k;const yy=y+Math.floor(mm/12);mm=((mm%12)+12)%12;const last=new Date(yy,mm+1,0).getDate();return yy+"-"+pad(mm+1)+"-"+pad(Math.min(d,last))}
function diaNoMes(m,dia){const[y,mo]=m.split("-").map(Number);const last=new Date(y,mo,0).getDate();return m+"-"+pad(Math.min(Math.max(1,dia),last))}
function diasAte(iso){return Math.round((new Date(iso+"T12:00")-new Date(HOJE()+"T12:00"))/864e5)}
const mesLabel=m=>{const[y,mo]=m.split("-");return MESES[+mo-1]+" de "+y};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const mesCurto=m=>MESES[+m.split("-")[1]-1].slice(0,3);
const brDate=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):"";
const brDM=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7):"";
function diaLabel(iso){const k=iso.slice(0,10);if(k===HOJE())return"Hoje";if(k===ymd(new Date(Date.now()-864e5)))return"Ontem";if(k===ymd(new Date(Date.now()+864e5)))return"Amanhã";return new Date(k+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}
const numBR=s=>{s=String(s??"").trim();if(!s)return 0;s=s.replace(/[^\d,.-]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)||0};

const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

function mascaraDinheiro(el,cb){el.addEventListener("input",()=>{const dg=el.value.replace(/\D/g,"").replace(/^0+/,"").slice(0,11);const v=dg?Number(dg)/100:0;el.value=dg?BRL(v):"";cb(v)})}
function pmt(P,i,n){return i>0?P*i/(1-Math.pow(1+i,-n)):P/n}
function taxaDe(P,parc,n){if(parc*n<=P+0.005)return 0;let lo=0,hi=2;for(let k=0;k<80;k++){const mid=(lo+hi)/2;pmt(P,mid,n)>parc?hi=mid:lo=mid}return(lo+hi)/2}
function telLimpo(t){let d=String(t||"").replace(/\D/g,"");if(!d)return"";if(!(d.startsWith("55")&&d.length>=12))d="55"+d;return d}

const GRUPOS_DRE=[["receita","Receita operacional"],["fin_r","Receita financeira"],["aporte","Aporte / não operacional"],["deducao","Impostos sobre vendas"],["custo","Custo variável"],["pessoal","Pessoal"],["ocupacao","Ocupação"],["admin","Administrativa"],["marketing","Marketing"],["financeira","Despesa financeira"],["retirada","Pró-labore / retirada"],["investimento","Investimento"]];

].map(([nome,tipo,grupo,det])=>({nome,icone:"",tipo,grupo,orcamento:0,det:tipo==="despesa"?(det||"nenhum"):"nenhum"}))}
async function migrarV4(d){
  const c=Object.assign(cfgPadrao(),clone(d));
  if(!d.empresas||!d.empresas.length)c.empresas=[empresaPadrao(Store.mode==="local")];
  if(!d.categoriasPJ)c.categoriasPJ=catsPJPadrao();
  if(!d.formasPJ)c.formasPJ=cfgPadrao().formasPJ;
  if(!d.iconeEstilo)c.iconeEstilo="sigla";
  c.contas=(d.contas||[]).map(x=>Object.assign({ctx:"pf"},x));c.cartoes=(d.cartoes||[]).map(x=>Object.assign({ctx:"pf"},x));
  const e1=c.empresas[0].id;if(!c.contas.some(x=>x.ctx!=="pf"))c.contas=c.contas.concat(contasPJPadrao(e1));
  c.v=4;
  try{await Store.set("config","app",c)}catch(e){S.cfg=c;render()}}

async function migrarV3(d){
  const c=Object.assign(cfgPadrao(),clone(d));
  c.categorias=(d.categorias||[]).map(x=>Object.assign({},x,{det:x.det||detPadrao(x.nome,x.tipo)}));
  const novas=[["Combustível","⛽","combustivel"],["Manutenção do carro","🔧","manutencao"],["Escola","🎒","escolar"]];
  novas.forEach(([nome,icone,det])=>{if(c.categorias.some(x=>x.nome===nome))return;let pos=c.categorias.findIndex(x=>x.tipo==="receita");if(pos<0)pos=c.categorias.length;c.categorias.splice(pos,0,{nome,icone,tipo:"despesa",orcamento:0,det})});
  c.exigirComprovante=d.exigirComprovante!==false;c.nomeApp=d.nomeApp||"Nossas Finanças";c.v=3;delete c.empresas;delete c.categoriasPJ;delete c.formasPJ;delete c.iconeEstilo;

const Local={data:{},subs:[],

  list(c,fs){return Object.entries(this.col(c)).map(([id,d])=>Object.assign({id},clone(d))).filter(d=>this.match(d,fs))},
  notify(c){this.subs.filter(s=>s.c===c).forEach(s=>setTimeout(()=>s.id?s.cb(this.col(c)[s.id]?clone(this.col(c)[s.id]):null):s.cb(this.list(c,s.fs)),0))}

const Store={mode:"local",

    const s={c,id,cb};Local.subs.push(s);setTimeout(()=>cb(Local.col(c)[id]?clone(Local.col(c)[id]):null),0);return()=>{Local.subs=Local.subs.filter(x=>x!==s)}},
  async get(c,fs){if(this.mode==="cloud"){const s=await this.q(c,fs).get();return s.docs.map(d=>Object.assign({id:d.id},clone(d.data())))}return Local.list(c,fs)},
  async set(c,id,d){d=clone(d);delete d.id;if(this.mode==="cloud")return S.db.doc(c+"/"+id).set(d);Local.col(c)[id]=d;Local.save();Local.notify(c)},

function faturaVenc(card,dataISO){
  const[y,m,d]=dataISO.split("-").map(Number);let fy=y,fm=m;
  if(d>=(card.fechamento||1)){fm++;if(fm>12){fm=1;fy++}}
  let vy=fy,vm=fm;if((card.vencimento||10)<=(card.fechamento||1)){vm++;if(vm>12){vm=1;vy++}}
  return diaNoMes(vy+"-"+pad(vm),card.vencimento||10)}
/* ocorrências de um lançamento entre meses ini..fim (YYYY-MM) */
function ocorr(l,ini,fim){
  const out=[],aj=l.aj||{};
  const push=(key,venc,valor,idx,n,rot)=>{if(!venc)return;const m=venc.slice(0,7);if(m<ini||m>fim)return;const a=aj[key]||{};if(a.x)return;
    const pp=key==="E";
    out.push({l,key:l.id+"|"+key,k:key,m,venc,valor:a.v!=null?a.v:valor,pago:l.plano?(a.pago!=null?!!a.pago:pp):!!l.pago,idx,n,rot:rot||"",ajustado:a.v!=null,fotosPag:l.plano?(a.fotos||[]):(l.fotosPag||[])})};
  if(!l.plano){if(l.mes)push("_",l.venc||l.data,l.valor);return out}
  if(l.parc&&!l.rec){const p=l.parc;
    if(p.entrada&&p.entrada.valor>0)push("E",p.entrada.data,p.entrada.valor,null,null,"Entrada");
    (p.extras||[]).forEach((x,i)=>push("X"+i,x.data,x.valor,null,null,"Pagamento extra"));
    for(let i=0;i<p.n;i++){const v=dAdd(p.primeiro,i),k=v.slice(0,7);if(k>fim)break;if(k<ini)continue;push(k,v,p.parcela,i+1,p.n)}
    return out}
  if(l.rec&&l.rec.inicio){const k0=l.rec.inicio.slice(0,7),f=l.rec.fim;let i=Math.max(0,mDiff(k0,ini));
    for(let g=0;g<600;g++,i++){const v=dAdd(l.rec.inicio,i),k=v.slice(0,7);if(k>fim)break;if(f&&(f.length>7?v>f:k>f))break;push(k,v,l.valor)}}
  return out}
function ocMes(m,todas){return S.mesSingles.filter(l=>todas||naCtx(l)).flatMap(l=>ocorr(l,m,m)).concat(S.planos.filter(l=>todas||naCtx(l)).flatMap(l=>ocorr(l,m,m)))}
function totais(ocs){let r=0,d=0,fx=0,vr=0;ocs.forEach(o=>{if(o.l.tipo==="receita")r+=o.valor;else{d+=o.valor;o.l.natureza==="fixa"?fx+=o.valor:vr+=o.valor}});return{r,d,s:r-d,fx,vr}}
function usoCartao(c){
  const cur=CUR();let u=0;
  S.futSingles.forEach(l=>{if(l.conta===c.id&&l.forma==="Crédito"&&!l.pago)u+=l.valor});
  S.planos.forEach(l=>{if(l.conta!==c.id||l.forma!=="Crédito")return;ocorr(l,cur,l.rec?cur:"9999-12").forEach(o=>{if(!o.pago)u+=o.valor})});
  return u}
function faturaDe(c,k){
  const ocs=S.futSingles.filter(l=>l.conta===c.id&&l.forma==="Crédito").flatMap(l=>ocorr(l,k,k))
    .concat(S.planos.filter(l=>l.conta===c.id&&l.forma==="Crédito").flatMap(l=>ocorr(l,k,k)));
  return{ocs,total:ocs.reduce((a,o)=>a+o.valor,0),aberto:ocs.filter(o=>!o.pago).reduce((a,o)=>a+o.valor,0)}}
async function marcarPago(o,val,fotos){
  if(!o.l.plano){const d={pago:val};if(fotos&&fotos.length){d.fotosPag=(o.l.fotosPag||[]).concat(fotos);o.l.fotosPag=d.fotosPag}return Store.update("lanc",o.l.id,d)}
  const aj=clone(o.l.aj||{});aj[o.k]=Object.assign({},aj[o.k],{pago:val});if(fotos&&fotos.length)aj[o.k].fotos=(aj[o.k].fotos||[]).concat(fotos);o.l.aj=aj;return Store.update("lanc",o.l.id,{aj})}

function montarAgenda(){
  const cur=CUR(),ini=addMonth(cur,-2),fim=addMonth(cur,2),itens=[],faturas=new Map();
  const ocs=S.futSingles.flatMap(l=>ocorr(l,ini,fim)).concat(S.planos.flatMap(l=>ocorr(l,ini,fim)));
  ocs.forEach(o=>{if(o.pago)return;const d=diasAte(o.venc);if(d>45||d<-60)return;
    const card=o.l.forma==="Crédito"&&cartaoById(o.l.conta);
    if(card&&o.l.tipo==="despesa"){const key=card.id+"|"+o.venc;if(!faturas.has(key))faturas.set(key,{tipo:"fatura",card,ctx:card.ctx||"pf",venc:o.venc,dias:d,valor:0,ocs:[]});const f=faturas.get(key);f.valor+=o.valor;f.ocs.push(o);return}
    const titulo=(o.l.desc||o.l.cat)+(o.idx?` (${o.idx}/${o.n})`:o.rot?` (${o.rot.toLowerCase()})`:"");
    itens.push({tipo:"lanc",o,ctx:ctxDe(o.l),venc:o.venc,dias:d,valor:o.valor,titulo,sub:(o.l.tipo==="receita"?"Receber":"Pagar")+" · "+(o.l.natureza==="fixa"?"fixa":o.idx?"parcela":"variável")+(o.l.unid?" · "+o.l.unid:"")+(o.l.quem?" · "+o.l.quem:""),receita:o.l.tipo==="receita"})});
  faturas.forEach(f=>itens.push(Object.assign(f,{titulo:"Fatura "+f.card.nome,sub:f.ocs.length+" lançamento(s)"})));
  S.emp.forEach(e=>{for(let i=0;i<e.n;i++){if(e.pagas&&e.pagas[i])continue;const v=dAdd(e.primeiro,i),d=diasAte(v);if(d>45)break;if(d<-60)continue;
    itens.push({tipo:"emp",e,i,ctx:ctxDe(e),venc:v,dias:d,valor:e.parcela,titulo:(e.dir==="emprestei"?"Receber de ":"Pagar a ")+e.nome+(e.n>1?` (${i+1}/${e.n})`:""),sub:"Empréstimo",receita:e.dir==="emprestei"})}});
  S.metas.forEach(m=>{if(!(m.aporte>0&&m.dia))return;[cur,addMonth(cur,1)].forEach(k=>{const v=diaNoMes(k,m.dia),d=diasAte(v);const feito=(m.aportesMes||{})[k];if(d>=-3&&d<=45&&!feito)itens.push({tipo:"meta",m,k,ctx:ctxDe(m),venc:v,dias:d,valor:m.aporte,titulo:"Guardar para "+m.nome,sub:"Meta de economia"})})});
  S.cfg.contas.forEach(c=>{const r=chequeResumo(c);if(!(r.tot.V>0&&r.ch.dia))return;let v=diaNoMes(cur,r.ch.dia);if(diasAte(v)<0)v=diaNoMes(addMonth(cur,1),r.ch.dia);
    itens.push({tipo:"cheque",c,ctx:c.ctx||"pf",venc:v,dias:diasAte(v),valor:Math.round((r.tot.juros+r.tot.iof)*100)/100,titulo:"Juros e IOF do cheque especial · "+c.nome,sub:"Previsto sobre "+BRL(r.tot.V)+" usados do limite"})});
  return itens.sort((a,b)=>a.venc.localeCompare(b.venc))}

const ALARMES=[["-P9DT15H","10 dias"],["-P4DT15H","5 dias"],["-PT15H","amanhã"],["PT9H","hoje"]];
const icsTxt=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
function icsEvento({id,data,titulo,desc,rrule}){
  const d=data.replace(/-/g,""),fim=new Date(data+"T12:00");fim.setDate(fim.getDate()+1);
  const L=["BEGIN:VEVENT","UID:"+id+"@nossasfinancas","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",
    "DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+ymd(fim).replace(/-/g,""),"SUMMARY:"+icsTxt(titulo),"DESCRIPTION:"+icsTxt(desc||"")];
  if(rrule)L.push("RRULE:"+rrule);
  ALARMES.forEach(([t,n])=>L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTxt(titulo+" ("+n+")"),"TRIGGER:"+t,"END:VALARM"));
  L.push("END:VEVENT");return L}

function resumoParc(){

function niceStep(mx){const raw=mx/4;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
const kfmt=v=>Math.abs(v)>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":Math.round(v).toLocaleString("pt-BR");
function grafColunas(dados,lb){lb=lb||["Entrou","Saiu","Sobrou"];
  const W=640,H=240,L=54,B=26,T=12,iw=W-L-10,ih=H-B-T;
  const mx=Math.max(1,...dados.flatMap(x=>[x.r,x.d])),st=niceStep(mx),top=Math.ceil(mx/st)*st;
  const gw=iw/dados.length,bw=Math.max(5,Math.min(16,gw/3.2));
  let g="";for(let v=0;v<=top+0.001;v+=st){const y=T+ih-v/top*ih;g+=`<line x1="${L}" x2="${W-10}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${kfmt(v)}</text>`}
  let pts="";
  dados.forEach((x,i)=>{const cx=L+gw*i+gw/2,hr=x.r/top*ih,hd=x.d/top*ih;
    g+=`<rect x="${cx-bw-1}" y="${T+ih-hr}" width="${bw}" height="${hr}" fill="var(--ganho)"><title>${mesLabel(x.m)}: ${lb[0].toLowerCase()} ${BRL(x.r)}</title></rect><rect x="${cx+1}" y="${T+ih-hd}" width="${bw}" height="${hd}" fill="var(--gasto)"><title>${mesLabel(x.m)}: ${lb[1].toLowerCase()} ${BRL(x.d)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${x.m===S.mes?"var(--ink)":"var(--muted)"}" font-weight="${x.m===S.mes?700:400}">${mesCurto(x.m)}</text>`;
    const ys=T+ih-Math.max(0,x.r-x.d)/top*ih;pts+=`${cx},${ys} `});

const taxaM=ch=>((ch.jurosM!=null?ch.jurosM:ch.juros)||0)/100;
const anualDe=m=>(Math.pow(1+m,12)-1);
const mensalDe=a=>(Math.pow(1+a,1/12)-1);
const pctTxt=v=>(Number(v)||0).toLocaleString("pt-BR",{maximumFractionDigits:4});
const pct2=v=>(Number(v)||0).toLocaleString("pt-BR",{maximumFractionDigits:2});
function diasEntre(a,b){return Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5)}
function usoCalc(ch,u){
  const m=taxaM(ch),ini=u.inicio||HOJE(),fim=u.fim||HOJE(),dias=Math.max(1,diasEntre(ini,fim)),V=Math.abs(u.valor||0);
  const iofD=(ch.iofDia!=null?ch.iofDia:0.0082)/100,iofA=(ch.iofAdic!=null?ch.iofAdic:0.38)/100;
  const juros=Math.round(V*(Math.pow(1+m,dias/30)-1)*100)/100,iof=Math.round((V*iofD*Math.min(dias,365)+V*iofA)*100)/100;
  return{V,dias,ini,fim,juros,iof,total:Math.round((V+juros+iof)*100)/100,semFim:!u.fim}}
function chequeResumo(c){
  const ch=c.cheque||{};let usos=ch.usos||[];
  if(!usos.length&&c.saldo<0)usos=[{valor:c.saldo,inicio:c.saldoData||HOJE(),fim:"",auto:true}];
  const calc=usos.map(u=>Object.assign({u},usoCalc(ch,u)));
  const tot=calc.reduce((a,x)=>({V:a.V+x.V,juros:a.juros+x.juros,iof:a.iof+x.iof,total:a.total+x.total}),{V:0,juros:0,iof:0,total:0});
  return{ch,calc,tot}}

      ${calc.map(x=>`<div class="resumo" style="margin-top:8px"><b>${BRL(x.V)}</b> · de ${brDate(x.ini)} até ${x.semFim?"hoje":brDate(x.fim)} (${x.dias} dia${x.dias>1?"s":""})${x.u.auto?' <span class="tag">saldo negativo</span>':""}<br>Juros ${BRL(x.juros)} · IOF ${BRL(x.iof)} · <b>total ${BRL(x.total)}</b></div>`).join("")}
      ${calc.length?`<p style="margin:10px 0 0">No fim, você paga <b class="neg">${BRL(tot.total)}</b>: ${BRL(tot.V)} usados + ${BRL(tot.juros)} de juros + ${BRL(tot.iof)} de IOF.</p>`:""}`:""}
    ${c.tarifa&&c.tarifa.valor?`<p class="hint">Tarifa do pacote: ${BRL(c.tarifa.valor)} todo dia ${c.tarifa.dia}. Já entra como conta fixa.</p>`:""}</div>`}).join("")}</div>

async function exportarCSV(){
  const docs=await Store.get("lanc",[]),fim=addMonth(CUR(),12);
  const rows=[["Ambiente","Unidade","Vencimento","Data da compra","Tipo","Fixa/Variável","Descrição","Categoria","Grupo DRE","Fornecedor/Cliente","Documento","Quem","Forma","Conta/Cartão","Parcela","Valor","Situação","Local","Detalhes"]];
  docs.flatMap(l=>ocorr(l,"2000-01",fim)).sort((a,b)=>a.venc.localeCompare(b.venc)).forEach(o=>{const l=o.l,d=l.det;
    const pjx=isPJ(ctxDe(l));rows.push([nomeCtx(ctxDe(l)),l.unid||"",brDate(o.venc),brDate(l.data),l.tipo==="receita"?"Entrada":"Saída",l.natureza==="fixa"?"Fixa":"Variável",l.desc||"",l.cat,pjx?(GRUPOS_DRE.find(g=>g[0]===grupoDe(o))||["",""])[1]:"",l.parte||"",l.ndoc||"",l.quem,l.forma,nomeConta(l.conta),o.idx?o.idx+"/"+o.n:o.rot||"",o.valor.toFixed(2).replace(".",","),o.pago?(l.tipo==="receita"?"Recebido":"Pago"):"Em aberto",d&&d.local||"",
      d?(d.comb?`${d.comb.tipo} ${fmtN(d.comb.litros)} L a ${BRL3(d.comb.precoL)}`:(d.itens||[]).map(x=>`${x.nome} ${fmtN(x.qtd)} ${x.un} ${BRL(x.total)}`).join(" | ")):""])});
  const csv="\ufeff"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const st=await baixar("lancamentos-"+HOJE()+".csv",new Blob([csv],{type:"text/csv"}));if(st==="saved")toast("Planilha pronta")}

async function restaurarDados(d){

  else if(S.assets){const mapa={};for(const[id,du]of Object.entries(fotos)){if(!String(id).startsWith("loc_"))continue;try{mapa[id]=await Fotos.put(await d2b(du))}catch(_){}}
    if(Object.keys(mapa).length){const tr=a=>(a||[]).map(x=>mapa[x]||x);(d.lanc||[]).forEach(l=>{l.fotos=tr(l.fotos);l.fotosPag=tr(l.fotosPag);if(l.foto)l.foto=mapa[l.foto]||l.foto;Object.values(l.aj||{}).forEach(a=>{if(a&&a.fotos)a.fotos=tr(a.fotos)})})}}
  if(Store.mode==="local"){Local.data={config:{app:d.config},lanc:{},emp:{},metas:{}};["lanc","emp","metas"].forEach(c=>(d[c]||[]).forEach(x=>{const y=Object.assign({},x),id=y.id;delete y.id;Local.data[c][id]=y}));Local.save();["config","lanc","emp","metas"].forEach(c=>Local.notify(c));return}
  const cfg=Object.assign({},d.config);cfg.vinculos=Object.assign({},d.config.vinculos||{},S.cfg.vinculos||{});await Store.set("config","app",cfg);
  for(const c of["lanc","emp","metas"])for(const x of d[c]||[]){const y=Object.assign({},x),id=y.id;delete y.id;await Store.set(c,id,y)}}

function editarEmpresa(i){
  const es=clone(S.cfg.empresas||[]),e=i>=0?es[i]:{id:"e"+uid(),nome:"",cnpj:"",regime:"Simples Nacional",aliquota:0,unidades:[]};const us=clone(e.unidades||[]).map(u=>Object.assign(u,{orig:u.nome}));
  const linhaU=(u,k)=>`<div class="li" style="flex-wrap:wrap"><input class="field" style="flex:1 1 150px" data-un="${k}" value="${esc(u.nome)}" placeholder="Nome da unidade" aria-label="Nome da unidade"><input class="field" style="flex:1 1 130px" data-um="${k}" inputmode="numeric" value="${u.meta?BRL(u.meta):""}" placeholder="Meta de faturamento" aria-label="Meta mensal de faturamento"><button class="x" data-ux="${k}" type="button" aria-label="Remover unidade">✕</button></div>`;
  abrirSheet(`${fechar}<h3>${i>=0?"Editar empresa":"Nova empresa"}</h3>
  <label class="lb"><span>Nome</span><input class="field" id="eNm" value="${esc(e.nome)}" placeholder="Razão social ou nome fantasia"></label>
  <div class="g2" style="margin-top:10px"><label class="lb"><span>CNPJ</span><input class="field" id="eCn" inputmode="numeric" value="${esc(e.cnpj||"")}" placeholder="opcional"></label>
  <label class="lb"><span>Regime tributário</span><select class="field" id="eRg">${["Simples Nacional","MEI","Lucro Presumido","Lucro Real"].map(r=>`<option ${e.regime===r?"selected":""}>${r}</option>`).join("")}</select></label></div>
  <label class="lb" style="margin-top:10px"><span>Alíquota efetiva sobre o faturamento (%)</span><input class="field" id="eAl" inputmode="decimal" value="${e.aliquota?pct2(e.aliquota):""}" placeholder="opcional, ex.: 6"></label>
  <p class="hint">Usada só para estimar os impostos no painel. Confirme a alíquota com a contabilidade.</p>
  <h2>Unidades e metas mensais de faturamento</h2><div class="lst" id="eUs"></div>
  <button class="chip" id="eAddU" type="button" style="margin-top:8px">+ Adicionar unidade</button>
  <div class="btns">${i>=0&&es.length>0?'<button class="btn danger" id="eDel" type="button">Excluir</button>':"<span></span>"}<button class="btn" id="eOk" type="button">Salvar</button></div>`,box=>{
    ligaFechar(box);const g=s=>box.querySelector(s);
    const ler=()=>{box.querySelectorAll("[data-un]").forEach(x=>us[+x.dataset.un].nome=x.value);box.querySelectorAll("[data-um]").forEach(x=>us[+x.dataset.um].meta=numBR(x.value))};
    const draw=()=>{g("#eUs").innerHTML=us.map(linhaU).join("")||'<p class="hint">Sem unidades: os lançamentos ficam todos no geral.</p>';box.querySelectorAll("[data-um]").forEach(x=>mascaraDinheiro(x,()=>{}));
      box.querySelectorAll("[data-ux]").forEach(x=>x.onclick=()=>{ler();us.splice(+x.dataset.ux,1);draw()})};draw();
    g("#eAddU").onclick=()=>{ler();us.push({nome:"",meta:0});draw()};
    g("#eOk").onclick=async()=>{ler();const nome=g("#eNm").value.trim();if(!nome)return toast("Informe o nome da empresa");
      const lst=us.map(u=>({nome:u.nome.trim(),meta:u.meta||0,orig:u.orig})).filter(u=>u.nome);if(new Set(lst.map(u=>u.nome)).size<lst.length)return toast("Há unidades com o mesmo nome");
      const novo={id:e.id,nome,cnpj:g("#eCn").value.trim(),regime:g("#eRg").value,aliquota:numBR(g("#eAl").value),unidades:lst.map(u=>({nome:u.nome,meta:u.meta}))};
      i>=0?es[i]=novo:es.push(novo);
      const extra={empresas:es};if(i<0)extra.contas=S.cfg.contas.concat(contasPJPadrao(novo.id).map(c=>Object.assign(c,{id:"pj"+uid()})));
      fecharSheet();await salvarCfg(extra);
      for(const u of lst)if(u.orig&&u.orig!==u.nome)await renomear("unid",u.orig,u.nome);
      toast("Empresa salva");render();sheetEmpresas()};
    const d=g("#eDel");if(d)confirmar(d,"Excluir empresa?",async()=>{
      try{const docs=(await Store.get("lanc",[])).filter(l=>l.ctx===e.id);if(docs.length){toast("Esta empresa tem "+docs.length+" lançamento(s). Exclua ou mova os lançamentos antes.",4200);return}}catch(_){}
      es.splice(i,1);fecharSheet();if(S.ctx===e.id)setCtx("pf");await salvarCfg({empresas:es,contas:S.cfg.contas.filter(c=>c.ctx!==e.id),cartoes:S.cfg.cartoes.filter(c=>c.ctx!==e.id)});render()})})}
function sheetPessoas(){
  const tels=S.cfg.telefones||{};
  abrirSheet(`${fechar}<h3>Pessoas e WhatsApp</h3><p class="hint">O WhatsApp é usado nos botões de lembrete.</p><div class="lst">${S.cfg.pessoas.map((p,i)=>`<div class="li" style="flex-wrap:wrap"><input class="field" style="flex:1 1 140px" data-pnm="${i}" value="${esc(p)}" aria-label="Nome"><input class="field" style="flex:1 1 150px" data-ptl="${i}" inputmode="tel" value="${esc(tels[p]||"")}" placeholder="WhatsApp com DDD" aria-label="WhatsApp de ${esc(p)}">${S.cfg.pessoas.length>1?`<button class="x" data-px="${i}" type="button" aria-label="Remover ${esc(p)}">✕</button>`:""}</div>`).join("")}</div>
  <div class="row" style="margin-top:10px"><input class="field" id="pNova" placeholder="Adicionar pessoa"><button class="chip" id="pAdd" type="button">Adicionar</button></div><button class="btn" id="pOk" type="button" style="margin-top:12px">Salvar</button>`,box=>{
    ligaFechar(box);
    box.querySelectorAll("[data-px]").forEach(x=>confirmar(x,"Remover?",async()=>{const a=S.cfg.pessoas.slice();a.splice(+x.dataset.px,1);await salvarCfg({pessoas:a});sheetPessoas()}));
    box.querySelector("#pAdd").onclick=async()=>{const n=box.querySelector("#pNova").value.trim();if(!n||S.cfg.pessoas.includes(n))return;await salvarCfg({pessoas:S.cfg.pessoas.concat(n)});sheetPessoas()};
    box.querySelector("#pOk").onclick=async()=>{const a=S.cfg.pessoas.slice(),t={},v=clone(S.cfg.vinculos||{}),ren=[];
      box.querySelectorAll("[data-pnm]").forEach(x=>{const i=+x.dataset.pnm,n=x.value.trim()||a[i],tel=box.querySelector(`[data-ptl="${i}"]`).value.trim();
        if(n!==a[i]&&!a.includes(n)){ren.push([a[i],n]);Object.keys(v).forEach(k=>{if(v[k]===a[i])v[k]=n});if(lsGet("nf_eu")===a[i])lsSet("nf_eu",n);a[i]=n}t[a[i]]=tel});
      fecharSheet();await salvarCfg({pessoas:a,telefones:t,vinculos:v});for(const[o,n]of ren)await renomear("quem",o,n);atualizarEu();toast("Pessoas salvas");render()}})}


iniciar().catch(e=>{console.error(e);$("#app").innerHTML='<p class="note">Não foi possível iniciar o app. Recarregue a página.</p>'});
})();
</script>
</body>
</html>
