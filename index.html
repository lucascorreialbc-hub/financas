<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Controle financeiro pessoal e da empresa, com DRE, vencimentos, cartões e relatórios em PDF.">
<title>Gestão Financeira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#F7F8FA; --ink:#101828; --muted:#5B6576; --line:#E1E5EB;
  --brand:#0B2545; --brand-ink:#FFFFFF; --accent:#1D4E89; --gasto:#B42318; --ganho:#067647; --sun:#B54708; --chip:#ECEFF3; --bar:#1D4E89;
  --head:#0B2545; --head-ink:#FFFFFF; --head-mut:#A9B8CC;
  --display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-ctx="pj"]{--head:#1E2A3A;--accent:#3E4C8A;--bar:#3E4C8A}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A101C; --surface:#111A2A; --surface2:#162033; --ink:#E6EAF0; --muted:#98A2B3; --line:#233049;
    --brand:#9DBCE6; --brand-ink:#0A101C; --accent:#9DBCE6; --gasto:#F97066; --ganho:#47CD89; --sun:#FDB022; --chip:#1A2539; --bar:#7FA6DA;
    --head:#0E1626; --head-ink:#E6EAF0; --head-mut:#8A98AE;
  }
}
:root[data-theme="dark"]{
  --bg:#0A101C; --surface:#111A2A; --surface2:#162033; --ink:#E6EAF0; --muted:#98A2B3; --line:#233049;
  --brand:#9DBCE6; --brand-ink:#0A101C; --accent:#9DBCE6; --gasto:#F97066; --ganho:#47CD89; --sun:#FDB022; --chip:#1A2539; --bar:#7FA6DA;
  --head:#0E1626; --head-ink:#E6EAF0; --head-mut:#8A98AE;
}
html{scroll-padding-top:calc(110px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:640px;margin:0 auto;padding:4px 16px 160px}
header.top{position:sticky;top:0;z-index:7;background:var(--head);color:var(--head-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;margin-top:calc(-1 * env(safe-area-inset-top,0px))}
header.top .hin{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top .ctxbar{max-width:640px;margin:8px auto 0}
.brandname{font-family:var(--display);font-weight:700;font-size:16.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brandname .lg{width:24px;height:24px;border-radius:6px;background:var(--head-ink);color:var(--head);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:-.02em}
header.top .pill{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--head-ink)}
header.top .pill b{color:var(--head-ink)}
.ctxseg{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;gap:3px}
.ctxseg button{flex:1;min-width:0;border:0;background:transparent;color:var(--head-mut);padding:7px 8px;border-radius:6px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxseg button[aria-pressed="true"]{background:var(--head-ink);color:var(--head)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill b{color:var(--ink);font-weight:600}
h1.tt{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.015em;margin:14px 0 2px}
.ctxlbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.ctxlbl+h1.tt{margin-top:2px}
h2{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.note{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:13.5px;color:var(--muted);margin:10px 0}
.note b{color:var(--ink)}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:6px;font-weight:600;color:var(--muted);font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.seg.tipo button[data-t="despesa"][aria-pressed="true"]{color:var(--gasto)}
.seg.tipo button[data-t="receita"][aria-pressed="true"]{color:var(--ganho)}
.valor{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-family:var(--display);font-weight:700;font-size:clamp(36px,10vw,52px);letter-spacing:-.025em;padding:14px 0 6px;color:var(--gasto);outline:none}
.valor:focus{border-bottom-color:var(--accent)}
.valor.receita{color:var(--ganho)}
.valor::placeholder{color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-size:14px;line-height:1.25;display:inline-flex;align-items:center;gap:6px;flex-direction:row}
.chip small{display:block;font-size:11.5px;color:var(--muted)}
.chip:has(small){flex-direction:column;align-items:flex-start;gap:0}
a.chip{color:var(--ink);text-decoration:none}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.chip[aria-pressed="true"] small{color:var(--brand-ink);opacity:.85}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13.5px;display:flex;align-items:center;gap:9px;text-align:left;line-height:1.2;min-height:46px}
.cat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:600}
.cb{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.02em;color:#fff;line-height:1}
.cb.em{background:var(--surface2)!important;font-size:16px;color:inherit}
.cb.lg{width:40px;height:40px;font-size:14px;border-radius:8px}
.cb.lg.em{font-size:22px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
select.field{appearance:auto}
label.lb{display:block}
label.lb>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.dias{display:flex;gap:6px;align-items:center}
.dias input{flex:1;min-width:0}
.resumo{margin-top:10px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px}
.resumo b{font-size:15px}
.foto{display:flex;gap:8px}
.foto label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed color-mix(in srgb,var(--muted) 55%,transparent);border-radius:8px;padding:12px;background:var(--surface);font-weight:600;font-size:14.5px;cursor:pointer}
.foto input{position:absolute;width:1px;height:1px;opacity:0}
.savebar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));padding:10px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.savebar .in{max-width:640px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--brand);border-radius:8px;padding:13px;font-weight:600;font-size:15.5px;background:var(--brand);color:var(--brand-ink);text-align:center;text-decoration:none}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--gasto);border:1px solid color-mix(in srgb,var(--gasto) 55%,transparent)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:7px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
a.wa{background:#157347;border-color:#157347;color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{position:relative;border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs button .i{font-size:21px;line-height:1}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--gasto);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:700}
nav.side{display:none}
.mes{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
.mes button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;font-size:18px;color:var(--muted)}
.mes .l{font-family:var(--display);font-weight:600;font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpis.k4{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kpi b{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pos{color:var(--ganho)} .neg{color:var(--gasto)} .mut{color:var(--muted)}
.dia{font-size:12px;color:var(--muted);margin:18px 2px 6px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted);font-size:12.5px}
.item .v{font-weight:600;white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.02em;border-radius:4px;padding:1px 6px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.red{background:color-mix(in srgb,var(--gasto) 14%,transparent);color:var(--gasto)}.tag.amb{background:color-mix(in srgb,var(--sun) 16%,transparent);color:var(--sun)}
.tag.pj{background:color-mix(in srgb,#3E4C8A 16%,transparent);color:#5161A8}
.empty{text-align:center;color:var(--muted);padding:30px 12px}
.big{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:-.025em;line-height:1.1;margin:4px 0 2px}
.bar{height:7px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--bar)}
.bar.warn i{background:var(--sun)} .bar.over i{background:var(--gasto)} .bar.ok i{background:var(--ganho)}
.hb{padding:7px 0}
.hb .row{font-size:14px}
.lst .li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.lst .li:last-child{border-bottom:0}
.x{border:0;background:none;color:var(--muted);font-size:16px;padding:4px 8px}
.orcin{width:130px;text-align:right}
.ag{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.ag .dt{flex:none;width:46px;text-align:center;border-radius:8px;background:var(--surface2);border:1px solid var(--line);padding:5px 0;line-height:1.1}
.ag .dt b{display:block;font-family:var(--display);font-size:18px}
.ag .dt small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ag .t{flex:1;min-width:0}
.ag .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ag .acts button,.ag .acts a{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:13px;text-decoration:none;color:var(--ink)}
.menu a,.menu button.mi,.menu label.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:6px;font-size:15px;font-weight:500}
.menu .mi>span:first-child{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);font-size:18px;flex:none}
.menu .mi small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.sheet{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:640px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet h3{font-family:var(--display);margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14.5px;margin:12px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:60;font-size:14.5px;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
label.ck{display:flex;gap:10px;align-items:center;padding:6px 0}
label.ck input{width:19px;height:19px;accent-color:var(--accent);flex:none}
.chart svg{display:block;width:100%;height:auto;max-width:720px;margin:0 auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--chip);margin:8px 0}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lock h3{font-family:var(--display);font-size:21px;margin:0 0 6px;font-weight:700}
.dots{display:flex;gap:12px;margin:18px 0 22px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-family:var(--display);font-weight:600}
.lgrid{display:block}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.th{position:relative;display:block;border:0;padding:0;background:none}
.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:var(--surface2)}
.th button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;width:28px;height:28px}
.it{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.it .full{grid-column:1/-1}
.tb .tr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tb .tr small{display:block;font-size:12px}
.tb .tr:last-child{border-bottom:0;font-weight:700}
.dre .tr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.dre .tr span:first-child{color:var(--muted)}
.dre .tr span:last-child{white-space:nowrap;text-align:right}
.dre .tr.sub{padding-left:12px;font-size:13.5px}
.dre .tr.tot{font-weight:700;border-bottom:1px solid var(--ink)}
.dre .tr.tot span:first-child{color:var(--ink)}
.dre .tr.fim{font-weight:700;font-size:15px;border-bottom:0;padding-top:10px}
.dre .tr.fim span:first-child{color:var(--ink)}
.dre .tr small{color:var(--muted);font-weight:400;margin-left:6px}
.dre .tr.out{opacity:.8;font-style:italic;border-bottom:0}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);-webkit-overflow-scrolling:touch}
table.tb2{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;min-width:max-content}
.tb2 tr{background:var(--surface)}
.tb2 thead tr{background:var(--surface2)}
.tb2 th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb2 td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb2 tr:last-child td{border-bottom:0}
.tb2 td:first-child,.tb2 th:first-child{position:sticky;left:0;background:inherit;z-index:1;border-right:1px solid var(--line)}
.tb2 .num{text-align:right;font-variant-numeric:tabular-nums}
.tb2 tr.tot{background:var(--surface2)} .tb2 tr.tot td{font-weight:700}
.tb2 tr.hd{background:var(--chip)} .tb2 tr.hd td{font-weight:700;color:var(--accent);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.tb2 tr.sub td:first-child{padding-left:24px;color:var(--muted)}
.tb2 tr.fim td{font-weight:700;font-size:14.5px;border-top:1.5px solid var(--ink)}
.tb2 tr.pct td{color:var(--muted);font-style:italic}
.tb2 tr.out td{color:var(--muted)}
.tb2 tr.clk{cursor:pointer} .tb2 tr.clk:hover{background:var(--surface2)}
.tb2 td.wrap{white-space:normal;min-width:220px;max-width:340px}
.ci{width:92px;border:1px solid color-mix(in srgb,var(--sun) 35%,var(--line));background:color-mix(in srgb,var(--sun) 8%,var(--surface));border-radius:6px;padding:5px 7px;text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;min-height:32px}
.ci.t{text-align:left;width:auto;min-width:150px}
select.ci{text-align:left;width:auto;min-width:120px}
.ci:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--surface)}
.subnav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:10px 0 4px;scrollbar-width:thin}
.subnav .chip{white-space:nowrap;flex:none}
.st{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:99px}

function faturaVenc(card,dataISO){

  if(d>=(card.fechamento||1)){fm++;if(fm>12){fm=1;fy++}}
  let vy=fy,vm=fm;if((card.vencimento||10)<=(card.fechamento||1)){vm++;if(vm>12){vm=1;vy++}}
  return diaNoMes(vy+"-"+pad(vm),card.vencimento||10)}
/* ocorrências de um lançamento entre meses ini..fim (YYYY-MM) */
function ocorr(l,ini,fim){
  const out=[],aj=l.aj||{};
  const push=(key,venc,valor,idx,n,rot)=>{if(!venc)return;const m=venc.slice(0,7);if(m<ini||m>fim)return;const a=aj[key]||{};if(a.x)return;
    const pp=key==="E";
    out.push({l,key:l.id+"|"+key,k:key,m,venc,valor:a.v!=null?a.v:valor,pago:l.plano?(a.pago!=null?!!a.pago:pp):!!l.pago,idx,n,rot:rot||"",ajustado:a.v!=null,fotosPag:l.plano?(a.fotos||[]):(l.fotosPag||[])})};
  if(!l.plano){if(l.mes)push("_",l.venc||l.data,l.valor);return out}
  if(l.parc&&!l.rec){const p=l.parc;
    if(p.entrada&&p.entrada.valor>0)push("E",p.entrada.data,p.entrada.valor,null,null,"Entrada");
    (p.extras||[]).forEach((x,i)=>push("X"+i,x.data,x.valor,null,null,"Pagamento extra"));
    for(let i=0;i<p.n;i++){const v=dAdd(p.primeiro,i),k=v.slice(0,7);if(k>fim)break;if(k<ini)continue;push(k,v,p.parcela,i+1,p.n)}
    return out}
  if(l.rec&&l.rec.inicio){const k0=l.rec.inicio.slice(0,7),f=l.rec.fim;let i=Math.max(0,mDiff(k0,ini));
    for(let g=0;g<600;g++,i++){const v=dAdd(l.rec.inicio,i),k=v.slice(0,7);if(k>fim)break;if(f&&(f.length>7?v>f:k>f))break;push(k,v,l.valor)}}
  return out}
function ocMes(m,todas){return S.mesSingles.filter(l=>todas||naCtx(l)).flatMap(l=>ocorr(l,m,m)).concat(S.planos.filter(l=>todas||naCtx(l)).flatMap(l=>ocorr(l,m,m)))}

  S.metas.forEach(m=>{if(!(m.aporte>0&&m.dia))return;[cur,addMonth(cur,1)].forEach(k=>{const v=diaNoMes(k,m.dia),d=diasAte(v);const feito=(m.aportesMes||{})[k];if(d>=-3&&d<=45&&!feito)itens.push({tipo:"meta",m,k,ctx:ctxDe(m),venc:v,dias:d,valor:m.aporte,titulo:"Guardar para "+m.nome,sub:"Meta de economia"})})});

const ALARMES=[["-P9DT15H","10 dias"],["-P4DT15H","5 dias"],["-PT15H","amanhã"],["PT9H","hoje"]];

function icsEvento({id,data,titulo,desc,rrule}){
  const d=data.replace(/-/g,""),fim=new Date(data+"T12:00");fim.setDate(fim.getDate()+1);
  const L=["BEGIN:VEVENT","UID:"+id+"@nossasfinancas","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",
    "DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+ymd(fim).replace(/-/g,""),"SUMMARY:"+icsTxt(titulo),"DESCRIPTION:"+icsTxt(desc||"")];
  if(rrule)L.push("RRULE:"+rrule);
  ALARMES.forEach(([t,n])=>L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTxt(titulo+" ("+n+")"),"TRIGGER:"+t,"END:VALARM"));
  L.push("END:VEVENT");return L}
function icsArquivo(evs){return["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Nossas Financas//PT-BR","CALSCALE:GREGORIAN","METHOD:PUBLISH"].concat(evs.map(icsEvento).flat(),["END:VCALENDAR"]).join("\r\n")}

async function hashPIN(p){const txt="nf|"+p;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=5381;for(const ch of txt)h=((h<<5)+h+ch.charCodeAt(0))|0;return"s"+h}
function telaPIN(modo,done){
  let dig="",primeiro=null;const el=document.createElement("div");el.className="lock";
  const titulo=()=>modo==="abrir"?"Digite seu PIN":primeiro?"Repita o novo PIN":"Crie um PIN de 4 dígitos";
  const draw=()=>{el.innerHTML=`<h3>${titulo()}</h3><p class="hint" style="text-align:center;max-width:320px">${modo==="abrir"?"Proteção deste aparelho.":"Ele será pedido ao abrir o app neste aparelho."}</p>
    <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<dig.length?"on":""}"></i>`).join("")}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-n="${n}">${n}</button>`).join("")}${modo==="abrir"?'<button type="button" data-esq style="font-size:13px">Esqueci</button>':'<button type="button" data-cancel style="font-size:13px">Cancelar</button>'}<button type="button" data-n="0">0</button><button type="button" data-del aria-label="Apagar">⌫</button></div>`;
    el.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{if(dig.length<4){dig+=b.dataset.n;draw();if(dig.length===4)setTimeout(fim,120)}});
    el.querySelector("[data-del]").onclick=()=>{dig=dig.slice(0,-1);draw()};
    const c=el.querySelector("[data-cancel]");if(c)c.onclick=()=>{el.remove();done&&done(false)};
    const e=el.querySelector("[data-esq]");if(e)e.onclick=()=>toast(Store.mode==="cloud"?"Para redefinir, limpe os dados do site no navegador. Seus lançamentos continuam salvos.":"Para redefinir, limpe os dados do site. Atenção: no modo aparelho isso apaga os dados; faça backup antes.",5200)};
  const fim=async()=>{
    if(modo==="abrir"){if(await hashPIN(dig)===lsGet("nf_pin")){el.remove();done&&done(true)}else{dig="";draw();toast("PIN incorreto")}return}
    if(!primeiro){primeiro=dig;dig="";draw();return}
    if(primeiro!==dig){primeiro=null;dig="";draw();toast("Os PINs não conferem. Tente de novo.");return}
    lsSet("nf_pin",await hashPIN(dig));el.remove();toast("PIN ativado");done&&done(true)};
  draw();document.body.appendChild(el)}

function calcParc(f){
  const n=Math.max(1,Math.min(120,parseInt(f.n,10)||1)),P=f.valor||0;
  const ent=f.entrada?(f.entradaValor||0):0,ext=(f.extras||[]).reduce((a,x)=>a+(x.valor||0),0);
  const fin=Math.max(0,Math.round((P-ent-ext)*100)/100);let parcela,i=0;
  if(!f.juros)parcela=fin/n;else if(f.parcelaManual){parcela=f.parcelaManual;i=taxaDe(fin,parcela,n)}else{i=numBR(f.taxa)/100;parcela=Math.round(pmt(fin,i,n)*100)/100}
  const total=f.juros?Math.round(parcela*n*100)/100:fin,juros=Math.max(0,total-fin);
  let ultimo=dAdd(primeiroPadrao(f),n-1);(f.extras||[]).forEach(x=>{if(x.data&&x.data>ultimo)ultimo=x.data});
  return{n,parcela,total,juros,pct:fin?juros/fin:0,taxa:i*100,ent,ext,fin,totalGeral:Math.round((ent+ext+total)*100)/100,ultimo}}

function niceStep(mx){const raw=mx/4;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
const kfmt=v=>Math.abs(v)>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":Math.round(v).toLocaleString("pt-BR");
function grafColunas(dados,lb){lb=lb||["Entrou","Saiu","Sobrou"];
  const W=640,H=240,L=54,B=26,T=12,iw=W-L-10,ih=H-B-T;
  const mx=Math.max(1,...dados.flatMap(x=>[x.r,x.d])),st=niceStep(mx),top=Math.ceil(mx/st)*st;
  const gw=iw/dados.length,bw=Math.max(5,Math.min(16,gw/3.2));
  let g="";for(let v=0;v<=top+0.001;v+=st){const y=T+ih-v/top*ih;g+=`<line x1="${L}" x2="${W-10}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${kfmt(v)}</text>`}
  let pts="";
  dados.forEach((x,i)=>{const cx=L+gw*i+gw/2,hr=x.r/top*ih,hd=x.d/top*ih;
    g+=`<rect x="${cx-bw-1}" y="${T+ih-hr}" width="${bw}" height="${hr}" fill="var(--ganho)"><title>${mesLabel(x.m)}: ${lb[0].toLowerCase()} ${BRL(x.r)}</title></rect><rect x="${cx+1}" y="${T+ih-hd}" width="${bw}" height="${hd}" fill="var(--gasto)"><title>${mesLabel(x.m)}: ${lb[1].toLowerCase()} ${BRL(x.d)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${x.m===S.mes?"var(--ink)":"var(--muted)"}" font-weight="${x.m===S.mes?700:400}">${mesCurto(x.m)}</text>`;
    const ys=T+ih-Math.max(0,x.r-x.d)/top*ih;pts+=`${cx},${ys} `});
  g+=`<polyline points="${pts}" fill="none" stroke="var(--sun)" stroke-width="2"/>`;
  dados.forEach((x,i)=>{const cx=L+gw*i+gw/2,ys=T+ih-Math.max(0,x.r-x.d)/top*ih;g+=`<circle cx="${cx}" cy="${ys}" r="3" fill="var(--sun)"/>`});
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por mês">${g}</svg></div><div class="legend"><span><i style="background:var(--ganho)"></i>${lb[0]}</span><span><i style="background:var(--gasto)"></i>${lb[1]}</span><span><i style="background:var(--sun)"></i>${lb[2]}</span></div>`}

function grupoDe(o){const c=catInfo(o.l.cat,ctxDe(o.l));let k=c.grupo||(o.l.tipo==="receita"?"receita":"admin");
  if(o.l.tipo==="receita"&&!["receita","fin_r","aporte"].includes(k))k="receita";
  if(o.l.tipo==="despesa"&&["receita","fin_r","aporte"].includes(k))k="admin";return k}
function dre(ocs){
  const g={};ocs.forEach(o=>{const k=grupoDe(o);g[k]=(g[k]||0)+o.valor});const v=k=>Math.round((g[k]||0)*100)/100;
  const RB=v("receita"),ded=v("deducao"),RL=RB-ded,cv=v("custo"),MC=RL-cv,pes=v("pessoal"),ocu=v("ocupacao"),adm=v("admin"),mkt=v("marketing"),fixas=pes+ocu+adm+mkt;
  const RO=MC-fixas,finR=v("fin_r"),finD=v("financeira"),LL=RO+finR-finD,ret=v("retirada"),RF=LL-ret,inv=v("investimento"),apo=v("aporte");
  const mcPct=RB?MC/RB:0,custoFixo=fixas+finD-finR,PE=mcPct>0?custoFixo/mcPct:null;
  return{g,RB,ded,RL,cv,MC,pes,ocu,adm,mkt,fixas,RO,finR,finD,LL,ret,RF,inv,apo,mcPct,PE,custoFixo,caixa:RF-inv+apo}}
function htmlDRE(d,emp){

  const das=emp&&emp.aliquota>0?Math.round(d.RB*emp.aliquota)/100:0;
  return`<div class="dre">
  ${L("Receita bruta",d.RB,"tot")}
  ${L("Impostos sobre vendas",d.ded,"sub",1)}
  ${L("Receita líquida",d.RL,"tot")}
  ${L("Custos variáveis (insumos, comissões, taxas)",d.cv,"sub",1)}
  ${L("Margem de contribuição",d.MC,"tot")}

const taxaM=ch=>((ch.jurosM!=null?ch.jurosM:ch.juros)||0)/100;
const anualDe=m=>(Math.pow(1+m,12)-1);
const mensalDe=a=>(Math.pow(1+a,1/12)-1);
const pctTxt=v=>(Number(v)||0).toLocaleString("pt-BR",{maximumFractionDigits:4});
const pct2=v=>(Number(v)||0).toLocaleString("pt-BR",{maximumFractionDigits:2});
function diasEntre(a,b){return Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5)}
function usoCalc(ch,u){
  const m=taxaM(ch),ini=u.inicio||HOJE(),fim=u.fim||HOJE(),dias=Math.max(1,diasEntre(ini,fim)),V=Math.abs(u.valor||0);
  const iofD=(ch.iofDia!=null?ch.iofDia:0.0082)/100,iofA=(ch.iofAdic!=null?ch.iofAdic:0.38)/100;
  const juros=Math.round(V*(Math.pow(1+m,dias/30)-1)*100)/100,iof=Math.round((V*iofD*Math.min(dias,365)+V*iofA)*100)/100;
  return{V,dias,ini,fim,juros,iof,total:Math.round((V+juros+iof)*100)/100,semFim:!u.fim}}
function chequeResumo(c){
  const ch=c.cheque||{};let usos=ch.usos||[];
  if(!usos.length&&c.saldo<0)usos=[{valor:c.saldo,inicio:c.saldoData||HOJE(),fim:"",auto:true}];
  const calc=usos.map(u=>Object.assign({u},usoCalc(ch,u)));
  const tot=calc.reduce((a,x)=>({V:a.V+x.V,juros:a.juros+x.juros,iof:a.iof+x.iof,total:a.total+x.total}),{V:0,juros:0,iof:0,total:0});

  if(Store.mode==="local"){for(const[id,du]of Object.entries(fotos)){try{const db=await Fotos.idb(),bl=await d2b(du);await new Promise((res,rej)=>{const t=db.transaction("f","readwrite");t.objectStore("f").put(bl,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(_){}}}
  else if(S.assets){const mapa={};for(const[id,du]of Object.entries(fotos)){if(!String(id).startsWith("loc_"))continue;try{mapa[id]=await Fotos.put(await d2b(du))}catch(_){}}
    if(Object.keys(mapa).length){const tr=a=>(a||[]).map(x=>mapa[x]||x);(d.lanc||[]).forEach(l=>{l.fotos=tr(l.fotos);l.fotosPag=tr(l.fotosPag);if(l.foto)l.foto=mapa[l.foto]||l.foto;Object.values(l.aj||{}).forEach(a=>{if(a&&a.fotos)a.fotos=tr(a.fotos)})})}}
  if(Store.mode==="local"){Local.data={config:{app:d.config},lanc:{},emp:{},metas:{},invest:{},intel:{},intelmes:{}};["lanc","emp","metas","invest","intel","intelmes"].forEach(c=>(d[c]||[]).forEach(x=>{const y=Object.assign({},x),id=y.id;delete y.id;Local.data[c][id]=y}));Local.save();["config","lanc","emp","metas","invest","intel","intelmes"].forEach(c=>Local.notify(c));return}
  const cfg=Object.assign({},d.config);cfg.vinculos=Object.assign({},d.config.vinculos||{},S.cfg.vinculos||{});await Store.set("config","app",cfg);
  for(const c of["lanc","emp","metas","invest","intel","intelmes"])for(const x of d[c]||[]){const y=Object.assign({},x),id=y.id;delete y.id;await Store.set(c,id,y)}}

/* ================= INTELIGÊNCIA FINANCEIRA: motor de cálculo (modelo VAZK) ================= */
const SIMPLES_TAB=[[0,.06,0,.04,0],[180000.01,.112,9360,.073,5940],[360000.01,.135,17640,.095,13860],[720000.01,.16,35640,.107,22500],[1800000.01,.21,125640,.143,87300],[3600000.01,.33,648000,.19,378000]];
const ENC_REAL={rbt12:[],socios:["Sócio 1","Sócio 2"]};
const N0=v=>Number(v)||0;
const FER=1/12*4/3,DEC=1/12;
function aliqSimples(rbt,anexo,P){
  const im=P.imposto||{};const ai=anexo==="III"?1:3;
  if(rbt>N0(im.teto||4800000))return N0(im.presumido);
  if(rbt<=0)return SIMPLES_TAB[0][ai];
  let f=SIMPLES_TAB[0];for(const x of SIMPLES_TAB)if(rbt>=x[0])f=x;
  return(rbt*f[ai]-f[ai+1])/rbt}
function custoPessoa(e,P){
  const c=P.clt||{};if(e.vinculo!=="CLT")return{J:0,K:0,L:0,M:0,fer:0,dec:0,fgts:0};
  const s=N0(e.salario),fer=s*FER,dec=s*DEC,fgts=(s+fer+dec)*N0(c.fgts),J=s+fer+dec+fgts,K=Math.max(0,N0(c.vt)-s*N0(c.vtDesc)),L=N0(c.alim);

function dreAnual(y,un,real){const meses=Array.from({length:12},(_,i)=>y+"-"+String(i+1).padStart(2,"0"));const emp=empresaAtual()||{unidades:[]};
  const metaMes=(emp.unidades||[]).filter(u=>un==="Todas"||u.nome===un).reduce((a,u)=>a+N0(u.meta),0);
  const col=meses.map(m=>{let os=(DREV.singles||[]).filter(naCtx).flatMap(l=>ocorr(l,m,m)).concat(S.planos.filter(naCtx).flatMap(l=>ocorr(l,m,m)));
    if(un!=="Todas")os=os.filter(o=>(o.l.unid||"")===un);if(real)os=os.filter(o=>o.pago);
    const d=dre(os),cats={};os.forEach(o=>{const g=grupoDe(o);cats[g]=cats[g]||{};cats[g][o.l.cat]=(cats[g][o.l.cat]||0)+o.valor});
    return{m,d,cats,CX:d.RF-d.inv+d.apo,META:metaMes,METAp:metaMes?d.RB/metaMes:0}});
  return{meses,col}}
function valDRE(c,k){const d=c.d;switch(k){case"RL":return d.RL;case"MC":return d.MC;case"MCp":return d.RB?d.MC/d.RB:null;case"RO":return d.RO;case"LL":return d.LL;case"LLp":return d.RB?d.LL/d.RB:null;case"RF":return d.RF;case"CX":return c.CX;case"PE":return d.PE;case"META":return c.META;case"METAp":return c.METAp}
  return d.g[k]||0}

  ["quem","Quem está usando o aparelho","<p>No primeiro uso, o app pergunta quem está usando o aparelho. Os lançamentos já saem com esse nome em “Quem comprou/recebeu”. Para trocar, toque no seu nome no canto superior direito. Com login ativo, o nome vem do usuário que entrou.</p>"]]],
 ["Movimento",[
  ["lancar","Lançar","<p>É onde se registra cada entrada ou saída.</p><ol><li>Escolha <b>Saída</b> ou <b>Entrada</b> e digite o valor só com números (1250 vira R$ 12,50).</li><li>Escolha se é <b>variável</b> (acontece uma vez) ou <b>fixa todo mês</b> (aluguel, assinatura). Na fixa, informe o 1º vencimento e o último pagamento.</li><li>Escolha a <b>categoria</b>. Algumas categorias abrem detalhes: itens de mercado com preço por unidade, combustível com litros e posto, peças e serviços da oficina, itens escolares.</li><li>Escolha a <b>forma de pagamento</b> e a conta ou cartão. No crédito, você pode dividir em parcelas, informar entrada, outros pagamentos e juros.</li><li>Marque se já foi pago ou se fica a pagar.</li><li>Anexe a foto do comprovante (até 6). Pela regra padrão, compra paga não salva sem comprovante; conta a pagar pede o comprovante só na hora de marcar como paga.</li></ol><h4>Na empresa</h4><p>Aparecem também fornecedor ou cliente, nota fiscal e <b>unidade</b> (ou Geral / rateio). Ao lançar <b>Pró-labore e retiradas</b>, o app pode lançar a mesma quantia como entrada no Pessoal automaticamente.</p>"],
  ["extrato","Extrato","<p>Lista os lançamentos do mês escolhido, por dia, com filtros por pessoa (Pessoal) ou por unidade (empresa). Toque num lançamento para ver os detalhes, as fotos, marcar como pago, alterar o valor de um mês, editar, encerrar uma conta fixa ou excluir.</p><div class=\"ex\">Contas fixas: “alterar só este mês” muda o valor daquele mês; “encerrar a partir deste mês” para as próximas cobranças sem apagar o histórico.</div>"],
  ["painel","Painel (Pessoal)","<p>Mostra o mês: quanto entrou, saiu e sobrou, a taxa de economia, saídas por categoria, gastos por pessoa, limites do mês, uso dos cartões e a evolução dos últimos 12 meses.</p>"],
  ["painelpj","Painel da empresa","<p>Mostra faturamento, custos e despesas, lucro líquido e margem líquida. Abaixo: metas de faturamento por unidade com projeção do mês e quanto falta por dia, a <b>DRE</b> do mês, resultado por unidade, despesas por categoria, orçamento e a evolução de faturamento e lucro em 12 meses.</p>"],
  ["dash","Dashboard 3D","<p>Uma visão completa da saúde financeira do ambiente selecionado (Pessoal ou empresa), com gráficos 3D interativos e um diagnóstico automático.</p><ul><li><b>Nota de saúde</b> de 0 a 100, calculada a partir dos riscos encontrados.</li><li><b>Indicadores do mês</b> e as <b>prioridades dos próximos 30 dias</b>.</li><li><b>12 meses em 3D</b> e <b>mapa de riscos</b>: arraste para girar e toque para ver os detalhes.</li><li><b>Diagnóstico</b> em pontos de melhoria, a desenvolver e pontos fortes. Cada item explica o risco, como melhorar e como escalar.</li></ul><div class=\"ex\">O diagnóstico usa seus lançamentos, contas, cartões, metas e planos. Ele aponta onde olhar primeiro, mas não substitui um contador ou consultor.</div>"],
  ["vencimentos","Vencimentos","<p>Reúne o que vence nos próximos 45 dias: contas fixas, parcelas, faturas de cartão, empréstimos, metas e cheque especial, do Pessoal e da empresa. Dá para marcar como pago, mandar lembrete no WhatsApp e adicionar ao calendário do celular (Google Agenda um por um, ou arquivo .ics com avisos de 10, 5 e 1 dia antes e no dia).</p>"]]],
 ["Controle",[
  ["cartoes","Cartões de crédito","<p>Cadastre cada cartão com limite, dia de fechamento e dia de vencimento. Cada compra no crédito abate do limite e entra na fatura certa. Ao pagar a fatura, o limite volta.</p>"],
  ["contas","Contas e cheque especial","<p>Cadastre contas correntes, poupança e dinheiro em espécie. Em cada conta você informa o limite do cheque especial, os juros ao mês ou ao ano (o outro é calculado), o IOF e o saldo atual, inclusive negativo. Em “Usos do limite”, informe valor e datas de início e fim: o app calcula juros, IOF e o total a pagar. A tarifa mensal da conta vira uma conta fixa automática.</p><p>Em Editar → Ambiente, uma conta pode ser movida do Pessoal para a empresa e vice-versa.</p>"],
  ["emprestimos","Empréstimos","<p>Registra dinheiro que você emprestou ou pegou emprestado, com parcelas, juros, datas e dados de pagamento. Para cobrar, o app monta a mensagem educada no WhatsApp com Pix, boleto ou link.</p>"],
  ["metas","Metas e reservas","<p>Defina quanto quer juntar e até quando. O app mostra quanto guardar por mês. Cada aporte pode ser registrado como saída (no Pessoal, em Reserva / Investimento; na empresa, fora do resultado).</p>"]]],
 ["Planejamento",[
  ["investimentos","Plano de investimentos","<p>Um mapa de onde o dinheiro deve entrar para crescer. Existe no Pessoal (desenvolvimento pessoal, inteligência social, imagem pessoal) e na empresa (marketing, equipamentos, RH, tecnologia, posicionamento de marca).</p><ul><li><b>Áreas</b>: itens sugeridos com o porquê e o momento certo. Toque num item para dar valor, nota de 0 a 10, status e data prevista.</li><li><b>Resumo</b>: total previsto, % por área, nota média e leitura rápida.</li><li><b>Ordem de investimento</b>: a fila automática pela nota, com valor acumulado.</li><li><b>Momento certo</b>: compara a sugestão com o faturamento médio da empresa nos últimos 3 meses.</li><li><b>Regra de ouro</b>: nota 7 ou mais precisa de data.</li></ul><div class=\"ex\">Nota 0–2: não é hora · 3–4: seria bom · 5–6: próximo semestre · 7–8: se não fizer, o crescimento trava · 9–10: é o gargalo de hoje.</div>"],
  ["intel","Inteligência financeira (empresa)","<p>A planilha de inteligência financeira do salão, no modelo VAZK: <b>Receitas − Seres humanos − Regulares − Não regulares = Lucro</b>. Campos com fundo âmbar são para preencher; o resto é calculado.</p>"],
  ["intel-resumo","Inteligência › Resumo","<p>Faturamento, meta, lucro, margem, ponto de equilíbrio, folga, ocupação e o peso de cada grupo de saída, por unidade e consolidado. Inclui o <b>Diagnóstico VAZK</b>: reserva em caixa de pelo menos 1 mês de saídas fixas, pró-labore pago completo e 3 meses seguidos sem colocar dinheiro do bolso.</p>"],
  ["intel-producao","Inteligência › Produção","<p>Digite quantos atendimentos cada profissional fez de cada serviço. O app calcula faturamento, parte do parceiro, parte do salão, horas ocupadas e produto usado. Também é aqui que entra a venda de produtos do mês.</p>"],
  ["intel-saidas","Inteligência › Receitas e saídas","<p>Mostra as receitas por serviço e todas as saídas: seres humanos (pró-labore, CLT com encargos, recepção, auxiliar, VT, alimentação, comissões), regulares (produtos, descartáveis, revenda, maquininha, Simples e as contas do mês) e não regulares. O botão “Puxar contas dos lançamentos do mês” preenche as contas a partir do que foi lançado no app. Embaixo, o <b>Caixa do mês</b>: caixa inicial, resultado, pró-labore pago, aportes, retiradas, caixa final e reserva.</p>"],
  ["intel-margem","Inteligência › Margem e preço","<p>Margem bruta, margem de contribuição, lucro, ponto de equilíbrio, ocupação das cadeiras, custo da hora de cadeira e a margem de cada serviço feito por parceiro e por CLT. O <b>simulador de preço</b> sugere o preço de um serviço a partir do tempo, do produto e do lucro desejado.</p>"],
  ["intel-historico","Inteligência › Histórico","<p>Os últimos 6 meses com faturamento, saídas, lucro, ocupação, caixa e reserva. Meses preenchidos na planilha são calculados sozinhos; meses antigos podem ser digitados como resumo.</p>"],
  ["intel-premissas","Inteligência › Premissas","<p>Os números-base: meta, postos, horas e dias por unidade; pró-labore de cada sócio e quanto cada unidade paga; encargos CLT; mix de recebimento e taxas da maquininha; custo e comissão de produtos; Simples Nacional (RBT12, CNPJs separados, alíquota efetiva calculada); serviços com preço, tempo, produto e % do salão; e a equipe com custo total por pessoa. Toque em EXEMPLO para marcar como REAL quando confirmar.</p>"],
  ["intel-cenario","Inteligência › Cenário","<p>Simula quanto custaria faturar um valor-alvo (por exemplo, R$ 1 milhão por mês ou por ano): quantos postos, lojas e pessoas seriam necessários, o imposto e o lucro esperado, mantendo o preço por hora e a operação do mês-base.</p>"],
  ["intel-indicadores","Inteligência › Indicadores","<p>Sete indicadores com meta e status OK/ATENÇÃO por unidade: faturamento, ticket médio, ocupação, margem, peso da folha, retorno de clientes em 90 dias, reclamações, NPS e eNPS. Inclui a tabela de acompanhamento semanal para a reunião de 20 minutos com o time.</p>"],
  ["intel-previs","Inteligência › Previsibilidade","<p>Receita = Leads × Conversão × Ticket × Frequência, atual e meta de 90 dias por unidade. Calcula também o potencial de uma campanha de reativação da base pelo WhatsApp e tem o relatório de resultado de 15 dias.</p>"],
  ["intel-produt","Inteligência › Produtividade","<p>Quanto vale a hora de cada sócio e onde ela está indo. Cada tarefa recebe um tipo e o app sugere manter, revisar, delegar ou eliminar, com o custo no mês. Meta: pelo menos 60% do tempo em produção com margem.</p>"],
  ["intel-mes","Inteligência › Virar o mês","<p>Avance o mês no seletor e toque em “Começar”. O app copia as contas regulares do mês anterior, zera os atendimentos e usa o caixa final do mês anterior como caixa inicial. Não é preciso copiar nada à mão.</p>"],
  ["dre","DRE anual (empresa)","<p>A planilha de DRE completa, mês a mês, com total do ano, média mensal e % da receita. Linhas: receita bruta, impostos, receita líquida, custos variáveis, margem de contribuição, pessoal, ocupação, administrativas, marketing, resultado operacional, financeiro, lucro líquido, retiradas, investimentos, aportes, variação de caixa, ponto de equilíbrio e meta.</p><ul><li>Toque numa linha com ▸ para ver as categorias.</li><li>Filtre por unidade e marque “Só realizado” para ver apenas o que foi pago e recebido.</li><li>“Mostrar % da receita” troca os valores pela análise vertical.</li><li>Exporte para Excel com um toque.</li></ul><div class=\"ex\">Cada categoria da empresa pertence a um grupo do DRE. Ajuste em Ajustes → Categorias.</div>"]]],
 ["Relatórios e dados",[
  ["pdf","Relatórios em PDF","<p>Gera um PDF do período escolhido, do ambiente selecionado, com resumo, DRE (na empresa), despesas por categoria, por pessoa ou unidade, a lista de lançamentos e, se quiser, as fotos dos comprovantes.</p>"],
  ["backup","Backup e planilha","<p>Em Ajustes → Backup e planilha você baixa uma cópia completa (lançamentos, empréstimos, metas, planos de investimento, inteligência financeira e ajustes), com ou sem fotos. A mesma tela restaura um backup e exporta os lançamentos para Excel (.csv).</p><p>Use o backup para guardar uma cópia no Google Drive ou levar os dados para a versão independente.</p>"]]],
 ["Ajustes e segurança",[
  ["ajustes","Ajustes","<ul><li><b>Empresas e unidades</b>: nome, CNPJ, regime, alíquota e as unidades com meta de faturamento.</li><li><b>Categorias</b>: nome, ícone, limite, formulário de detalhes e, na empresa, o grupo do DRE.</li><li><b>Limites do mês</b>, <b>formas de pagamento</b>, <b>cartões</b> e <b>contas</b> do ambiente selecionado.</li><li><b>Nome do app</b>, <b>pessoas e WhatsApp</b>, <b>mensagens de cobrança</b> e <b>dados para receber</b> (Pix, banco, boleto, link).</li><li><b>Regras dos lançamentos</b>: comprovante obrigatório ou opcional.</li><li><b>Aparência</b>: tema claro, escuro ou automático e categorias com siglas ou ícones.</li></ul>"],
  ["login","Login e senha","<p>Em Ajustes → Login e senha, ative o login criando o primeiro administrador. A partir daí, o app pede usuário e senha ao abrir.</p><ul><li>Crie um usuário para cada pessoa, com acesso a tudo, só ao Pessoal ou só à empresa.</li><li>“Lança como” liga o usuário a uma pessoa da família.</li><li>“Manter conectado” guarda o acesso no aparelho por 30 dias.</li><li>Ao ativar, o app mostra um <b>código de recuperação</b>. Guarde: ele permite redefinir uma senha esquecida na tela de entrada.</li><li>“Desconectar todos” pede login de novo em todos os aparelhos.</li><li>Para trocar a própria senha ou sair, toque no seu nome no topo.</li></ul><div class=\"ex\">O login protege a abertura do app. No link do Claude, os dados continuam na conta de quem tem acesso ao link; na versão independente, ficam no navegador do aparelho.</div>"],
  ["pin","PIN do aparelho","<p>Além do login, cada aparelho pode ter um PIN de 4 dígitos, pedido toda vez que o app abre naquele aparelho.</p>"]]],
 ["Versões e dúvidas",[
  ["versoes","Link do Claude × versão independente","<p><b>Link do Claude</b>: os dados ficam na nuvem do Claude e aparecem em todos os aparelhos de quem usa o link.</p><p><b>Versão independente (GitHub)</b>: abre sem conta no Claude e pode ser instalada na tela inicial. Os dados ficam só no aparelho e navegador onde você lança. Para levar dados de um lugar para outro, use backup e restauração.</p>"],
  ["faq","Perguntas frequentes","<h4>Lancei na empresa, mas queria no Pessoal.</h4><p>Abra o lançamento, toque em Editar e troque o “Ambiente deste lançamento”.</p><h4>Por que a DRE não bate com a Inteligência financeira?</h4><p>A DRE usa os lançamentos reais. A Inteligência financeira calcula pela produção de cada profissional e pelas premissas. A diferença mostra onde o planejado e o realizado se afastaram.</p><h4>O comprovante entra nas somas?</h4><p>Não. As fotos servem só para controle.</p><h4>Esqueci a senha.</h4><p>Peça ao administrador para redefinir, ou use o código de recuperação na tela de entrada.</p>"],
  ["glossario","Glossário","<ul><li><b>DRE</b>: demonstrativo do resultado; mostra como a receita vira lucro.</li><li><b>Margem de contribuição</b>: o que sobra da venda depois dos custos que variam com ela.</li><li><b>Ponto de equilíbrio</b>: faturamento mínimo para não ter prejuízo.</li><li><b>Pró-labore</b>: remuneração mensal dos sócios pelo trabalho.</li><li><b>RBT12</b>: receita bruta dos últimos 12 meses, usada para achar a faixa do Simples.</li><li><b>Ocupação</b>: horas atendidas ÷ horas disponíveis das cadeiras.</li><li><b>Ticket médio</b>: faturamento ÷ número de atendimentos.</li><li><b>NPS / eNPS</b>: satisfação de clientes / do time, de 0 a 10.</li><li><b>VAZK</b>: modelo Receitas − Seres humanos − Regulares − Não regulares = Lucro.</li></ul>"]]]];
const MANUAL_FIGS={"ambiente":[{"src":"img/manual/ambiente.webp","w":620,"h":798,"wide":false,"cap":"Topo do app no celular","steps":["<b>Seletor de ambiente.</b> Toque em <b>Pessoal</b> para as finanças da família ou no nome da <b>empresa</b>. Tudo abaixo passa a mostrar só aquele ambiente.","<b>Quem está usando.</b> Mostra seu nome (ou o usuário do login). Toque para trocar a pessoa ou sair."],"alt":"Topo do app no celular"}],"lancar":[{"src":"img/manual/lancar-1.webp","w":620,"h":1260,"wide":false,"cap":"Lançar: parte de cima","steps":["Escolha <b>Saída</b> para um gasto ou <b>Entrada</b> para dinheiro que chega.","Digite o <b>valor só com números</b>: 1250 vira R$ 12,50. Não precisa de vírgula.","<b>Variável</b> acontece uma vez. <b>Fixa, todo mês</b> é para aluguel, escola, assinaturas: o app repete sozinho.","Toque na <b>categoria</b>. Ela organiza o painel e os relatórios."],"alt":"Lançar: parte de cima"},{"src":"img/manual/lancar-2.webp","w":620,"h":944,"wide":false,"cap":"Lançar: parte de baixo","steps":["Escolha a <b>forma de pagamento</b>. No <b>Crédito</b>, aparece o cartão e a opção de parcelar.","Diga se <b>já foi pago</b> ou se fica <b>a pagar</b> (vai para Vencimentos).","Anexe a <b>foto do comprovante</b>: fotografe na hora ou escolha da galeria.","Toque em <b>Salvar lançamento</b>. O formulário limpa para o próximo."],"alt":"Lançar: parte de baixo"},{"src":"img/manual/lancar-pj.webp","w":620,"h":791,"wide":false,"cap":"Campos extras da empresa","steps":["Na empresa, informe <b>fornecedor ou cliente</b> e o número da <b>nota fiscal</b> (opcional).","Escolha a <b>unidade</b> (loja). Use <b>Geral / rateio</b> para gastos das duas.","Ao lançar <b>Pró-labore e retiradas</b>, deixe marcado para a mesma quantia <b>entrar no Pessoal</b> automaticamente."],"alt":"Campos extras da empresa"}],"extrato":[{"src":"img/manual/extrato.webp","w":620,"h":724,"wide":false,"cap":"Extrato do mês","steps":["Use as <b>setas</b> para mudar de mês.","Filtre por <b>pessoa</ async function entregarPDF(nome,blob){let file=null;try{file=new File([blob],nome,{type:"application/pdf"})}catch(e){}
  if(Store.mode==="local"&&file&&navigator.canShare&&navigator.canShare({files:[file]})){abrirSheet(`${fechar}<h3>PDF pronto</h3><p class="hint">${esc(nome)} · ${fmtD(blob.size/1048576,1)} MB</p><div class="btns"><button class="btn ghost" id="pdB" type="button">${ic("dl")} Baixar</button><button class="btn" id="pdE" type="button">${ic("wa")} Enviar</button></div><p class="hint">Enviar abre as opções do celular: WhatsApp, e-mail, Drive e outros.</p>`,box=>{ligaFechar(box);
    box.querySelector("#pdE").onclick=async()=>{try{await navigator.share({files:[file],title:nome});fecharSheet()}catch(e){if(e&&e.name!=="AbortError")toast("Não foi possível abrir o envio")}};box.querySelector("#pdB").onclick=async()=>{fecharSheet();const st=await baixar(nome,blob);if(st==="saved")toast("PDF salvo")}});return}
  const st=await baixar(nome,blob);if(st==="saved")toast("PDF pronto")}
function itemAtualPDF(){const t=S.tab,it={tab:t,titulo:TAB_NOMES[t]||t};if(t==="intel"){const s=S.intelSub||"resumo";it.intelSub=s;it.titulo="Inteligência financeira - "+(SUBS.find(x=>x[0]===s)||["",""])[1]}if(t==="invest"){it.invVista=S.invVista||"resumo"}return it}
function listaTodasAbas(pj){const L=[["painel"],["dash"],["extrato"],["agenda"],["cartoes"],["contas"],["emprestimos"],["metas"]].map(([t])=>({tab:t,titulo:TAB_NOMES[t]}));
  L.push({tab:"invest",invVista:"resumo",titulo:"Plano de investimentos - Resumo"},{tab:"invest",invVista:"ordem",titulo:"Plano de investimentos - Ordem"});
  if(pj){SUBS.filter(s=>s[0]!=="guia").forEach(([k,n])=>L.push({tab:"intel",intelSub:k,titulo:"Inteligência financeira - "+n}));L.push({tab:"dre",titulo:"DRE anual"})}
  L.push({tab:"ajuda",titulo:"Manual do app"});return L}
function botaoPDFTela(){if(["lancar","pdf","mais","ajustes"].includes(S.tab)||S.pdfModo)return;const app=$("#app");if(!app||!app.firstElementChild)return;
  const b=document.createElement("button");b.type="button";b.className="pdfbtn";b.innerHTML=ic("file")+" PDF desta tela";b.onclick=()=>{const it=itemAtualPDF();gerarPDFAbas([it],`${(it.titulo||"tela").replace(/[^\wÀ-ú]+/g,"-").toLowerCase()}-${HOJE()}.pdf`)};app.insertBefore(b,app.firstChild)}
function blocoPDFAbas(){const pj=isPJ(),L=listaTodasAbas(pj);const sel=S.pdfSel||(S.pdfSel={});
  return`<h2>PDF das abas do app</h2><div class="card"><p class="hint" style="margin-top:0">Gera um PDF com a tela de cada aba escolhida, como aparece no app, do ambiente selecionado no topo (${esc(nomeCtx(S.ctx))}). Mês de referência: ${esc(mesLabel(S.mes))}.</p>
  <div class="row" style="gap:8px;margin:6px 0 4px"><button class="chip" type="button" id="paTodas">Marcar todas</button><button class="chip" type="button" id="paNenhuma">Desmarcar</button></div>
  <div class="cols2">${L.map((it,i)=>`<label class="ck"><input type="checkbox" data-pa="${i}" ${sel[it.titulo]!==false?"checked":""}> ${esc(it.titulo)}</label>`).join("")}</div>
  <button class="btn" id="paGerar" type="button" style="margin-top:10px">${ic("file")} Gerar PDF das abas</button><p class="hint">Cada tela também tem o botão “PDF desta tela” no topo.</p></div>`}
function ligarPDFAbas(){const L=listaTodasAbas(isPJ()),sel=S.pdfSel||(S.pdfSel={});
  $$("[data-pa]").forEach(c=>c.onchange=()=>{sel[L[+c.dataset.pa].titulo]=c.checked});
  $("#paTodas").onclick=()=>{L.forEach(it=>sel[it.titulo]=true);$$("[data-pa]").forEach(c=>c.checked=true)};$("#paNenhuma").onclick=()=>{L.forEach(it=>sel[it.titulo]=false);$$("[data-pa]").forEach(c=>c.checked=false)};
  $("#paGerar").onclick=()=>{const its=L.filter(it=>sel[it.titulo]!==false);gerarPDFAbas(its,`relatorio-completo-${isPJ()?"empresa":"pessoal"}-${HOJE()}.pdf`)}}


iniciar().catch(e=>{console.error(e);$("#app").innerHTML='<p class="note">Não foi possível iniciar o app. Recarregue a página.</p>'});
})();
</script>
</body>
